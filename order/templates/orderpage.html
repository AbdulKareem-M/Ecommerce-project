{% extends 'base.html' %}

{% block content %}
  <h2>Order {{ item.name }}</h2>
  <form method="post">
    {% csrf_token %}
    <label>Quantity:</label>
    <input type="number" name="quantity" min="1" max="{{ item.stock }}" required>
    <button type="submit">Place Order</button>
  </form>
{% endblock %}
