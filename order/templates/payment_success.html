{% extends "base.html" %}
{% block title %}Payment Successful{% endblock %}

{% block content %}
  <div class="alert alert-success mt-4">
    <h2>Thank You!</h2>
    <p>Your payment was successful.</p>
    <p><strong>Order ID:</strong> {{ summary.order_id }}</p>
    <p><strong>Payment ID:</strong> {{ summary.payment_id }}</p>
    <p><strong>Total Paid:</strong> ₹{{ summary.total }}</p>
    <a href="{% url 'home' %}" class="btn btn-primary mt-3">Continue Shopping</a>
  </div>
{% endblock %}
