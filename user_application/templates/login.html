{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-form">
  <h2>Login</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Login</button>
  </form>
  <a href="{%url 'register'%}">Sign up?</a>
</div>
{% endblock %}
<style>
.auth-form {
  max-width: 400px;
  margin: 50px auto;
  padding: 20px;
  border: 1px solid #ddd;
  border-radius: 5px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.auth-form h2 {
  text-align: center;
  margin-bottom: 20px;
}

.auth-form form {
  margin-bottom: 15px;
}

.auth-form button {
  width: 100%;
  margin-top: 10px;
}

.auth-form a {
  display: block;
  text-align: center;
  margin-top: 10px;
  color: #007bff;
  text-decoration: none;
}
</style></style>
